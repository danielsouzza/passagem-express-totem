name: Android Develop

# Toda atualização na develop gera um APK de release assinado e publica uma pré-release do GitHub.
# Mesmo build da main (android-release.yml), mas separado da produção:
#   - tag `develop-build-N` (a main usa `build-N`);
#   - marcada como pré-release, então NÃO vira a "latest" — o link fixo
#     /releases/latest/download/passagenexpress-latest.apk continua apontando pra build da main.
#
# Usa os mesmos segredos do workflow da main (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, PASSAGENEXPRESS_API_TOKEN
on:
  push:
    branches: [develop]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Remonta a keystore a partir dos secrets, no caminho que o app/build.gradle.kts
      # espera: <workspace>/../environment/ (ver rootProject.file(...) lá).
      - name: Preparar assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          mkdir -p "$RUNNER_WORKSPACE/environment"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_WORKSPACE/environment/passagenexpress.keystore"
          cat > "$RUNNER_WORKSPACE/environment/passagenexpress-key.properties" <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../../environment/passagenexpress.keystore
          EOF

      # run_number é monotônico entre execuções desta action (contador próprio, separado da main).
      - name: Resolver versão
        id: versao
        run: |
          BUILD=${{ github.run_number }}
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=develop-build-$BUILD" >> "$GITHUB_OUTPUT"
          echo "arquivo=passagenexpress-develop-$BUILD.apk" >> "$GITHUB_OUTPUT"

      - name: Build do APK
        env:
          API_TOKEN: ${{ secrets.PASSAGENEXPRESS_API_TOKEN }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease -Ppassagenexpress.apiToken="$API_TOKEN"
          cp app/build/outputs/apk/release/app-release.apk "${{ steps.versao.outputs.arquivo }}"

      - name: Publicar pré-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versao.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Passagem Express DEVELOP (build ${{ steps.versao.outputs.build }})
          prerelease: true
          make_latest: false
          body: |
            Build de desenvolvimento (branch develop) — não usar em totem de produção.

            Commit: ${{ github.sha }}
          files: ${{ steps.versao.outputs.arquivo }}
          fail_on_unmatched_files: true
