org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
# KSP 2.2.10-x.y.z ainda usa kotlin.sourceSets para registrar gerados; AGP 9 só aceita
# essa configuracao com este flag. Remover quando bumparmos Kotlin -> 2.3+ e KSP -> 2.3+.
android.disallowKotlinSourceSets=false

kotlin.code.style=official
ksp.incremental=true

# O valor real fica em ~/.gradle/gradle.properties (fora do repo) ou é passado via
# -Ppassagenexpress.apiToken=... no CI. Nunca commitar o token aqui.
passagenexpress.apiToken=

# PIN que protege o acesso à tela de configurações no totem. Default 0000 se não definido.
passagenexpress.settingsPin=0000